<!-- Firebase Realtime Database (module, loaded before Babel) -->
<script type="module">
  import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyA9RN5oze2P7dvRHDXo0yV1vsAbSQqS_2A",
    authDomain:        "golden-lotus-satx.firebaseapp.com",
    databaseURL:       "https://golden-lotus-satx-default-rtdb.firebaseio.com",
    projectId:         "golden-lotus-satx",
    storageBucket:     "golden-lotus-satx.firebasestorage.app",
    messagingSenderId: "930586375063",
    appId:             "1:930586375063:web:19beaa7a85f1c075db4ad2"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // Expose a simple DB API on window so the Babel script can use it
  window._db = {
    // Listen to a path; cb(data) called with parsed value (or null)
    listen(path, cb) {
      const r = ref(db, path);
      onValue(r, snap => cb(snap.exists() ? snap.val() : null));
      // return unsubscribe fn
      return () => onValue(r, () => {});
    },
    // Write a value to a path
    async write(path, value) {
      await set(ref(db, path), value);
    },
    // Delete a path
    async remove(path) {
      await remove(ref(db, path));
    }
  };

  // Signal that Firebase is ready
  window._firebaseReady = true;
  window.dispatchEvent(new Event("firebaseReady"));
</script>

<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  // ── Constants ───────────────────────────────────────────────────────────────
  const ADMIN_PASS   = "goldenlotus_admin";
  const VIEWER_PASS  = "goldenlotus_dancer";

  const EVENT_TYPES        = ["Tet","Ullambana","Vesak","Mid-Autumn","General","Other"];
  const PERFORMED_OPTS     = ["Not yet","In Progress","Performed"];
  const VIDEO_COLORS       = ["#8B4513","#0A5A8B","#2E7D32","#5A2D8B","#7A5C00","#C0392B","#1A5A4A","#7A3B69","#555555"];
  const VIDEO_COLOR_LABELS = ["Terracotta","Ocean","Forest","Plum","Gold","Crimson","Teal","Mauve","Slate"];

    Meeting:     { bg:"#E8F5E9", color:"#2E7D32" },

  const TAG_COLORS  = {

    Ullambana:    { bg:"#EDE0FF", color:"#5A2D8B" },

    Other:        { bg:"#F5F5F5", color:"#555"    },

  const PERFORMED_COLORS = {

    "In Progress": { bg:"#FFF3CD", color:"#7A5C00" },
    "Performed":   { bg:"#D4EDDA", color:"#155724" },

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function parseYouTubeId(url) {
    try {
      const u = new URL(url.trim());
      if (u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("?")[0];
      if (u.hostname.includes("youtube.com")) {
        if (u.pathname.startsWith("/shorts/")) return u.pathname.split("/shorts/")[1].split("?")[0];
        return u.searchParams.get("v") || "";
      }
    } catch {}
    return "";
  }
  const formatTime = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  function parseTime(str) {
    const p = str.trim().split(":").map(Number);
    if (p.length===2 && p.every(n=>!isNaN(n))) return p[0]*60+p[1];
    if (p.length===3 && p.every(n=>!isNaN(n))) return p[0]*3600+p[1]*60+p[2];
    return NaN;
  }
  function hex2rgba(hex,a=1){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
  function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
  function firstDayOfMonth(y,m){return new Date(y,m,1).getDay();}
  function toDateKey(y,m,d){return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}

  // ── Firebase DB wrapper (waits until module is ready) ──────────────────────
  function waitForDB() {
    return new Promise(resolve => {
      if (window._firebaseReady && window._db) { resolve(window._db); return; }
      window.addEventListener("firebaseReady", () => resolve(window._db), { once: true });
    });
  }

  // Listen hook: subscribes to a Firebase path and returns live value
  function useFirebase(path) {
    const [data,    setData]    = useState(undefined); // undefined = loading
    const [dbReady, setDbReady] = useState(!!window._firebaseReady);
    useEffect(() => {
      if (!dbReady) {
        waitForDB().then(() => setDbReady(true));
        return;
      }
      const unsub = window._db.listen(path, val => setData(val === null ? null : val));
      return unsub;
    }, [path, dbReady]);
    return data;
  }

  // ── Style constants ──────────────────────────────────────────────────────────
  const F = "'Be Vietnam Pro', sans-serif";
  const BTN       = { background:"#2C1810", color:"#E8C98A", border:"none", borderRadius:8, padding:"7px 16px", cursor:"pointer", fontSize:13, fontFamily:F, fontWeight:600 };
  const BTN_GHOST = { border:"0.5px solid #D4B896", background:"none", borderRadius:8, padding:"7px 16px", cursor:"pointer", fontSize:13, fontFamily:F };
  const INPUT_S   = { width:"100%", border:"0.5px solid #D4B896", borderRadius:8, padding:"9px 12px", fontSize:13, fontFamily:F, outline:"none", boxSizing:"border-box" };

  function SectionLabel({children}){ return <div style={{fontSize:11,fontWeight:600,color:"#8B7355",letterSpacing:"0.9px",textTransform:"uppercase",marginBottom:10}}>{children}</div>; }

  // ── Root App ─────────────────────────────────────────────────────────────────
  function App() {
    const [role,       setRole]       = useState(null);
    const [page,       setPage]       = useState("home");
    const [activeSong, setActiveSong] = useState(null);

    // Top-level Firebase listeners
    const songsRaw   = useFirebase("songs");
    const siteRaw    = useFirebase("site");
    const calRaw     = useFirebase("calendar");

    // Coerce Firebase objects → arrays/objects with safe defaults
    const songs    = songsRaw   ? Object.values(songsRaw)   : (songsRaw   === null ? [] : undefined);
    const siteData = siteRaw    ? siteRaw                   : (siteRaw    === null ? { about:"", logoUrl:"", contact:"", photos:[] } : undefined);
    const calEvents= calRaw     !== undefined ? (calRaw || {}) : undefined;

    const loading = songs===undefined || siteData===undefined || calEvents===undefined;

    const saveSongs = useCallback(async (updated) => {
      const db = await waitForDB();
      // Store as object keyed by id for Firebase
      const obj = {};
      updated.forEach(s => { obj[s.id] = s; });
      await db.write("songs", obj);
    }, []);

    const saveSiteData = useCallback(async (updated) => {
      const db = await waitForDB();
      await db.write("site", updated);
    }, []);

    const saveCalEvents = useCallback(async (updated) => {
      const db = await waitForDB();
      await db.write("calendar", updated);
    }, []);

    if (loading) return <Splash logoUrl="" />;

    const isAdmin  = role === "admin";
    const canEdit  = isAdmin;
    const loggedIn = role === "viewer" || role === "admin";
    const navigate = (p) => { setPage(p); setActiveSong(null); };

    if (page === "resources" && !loggedIn) {
      return (
        <div style={{ minHeight:"100vh", background:"#FDFAF6" }}>
          <NavBar page={page} loggedIn={false} isAdmin={false} navigate={navigate} onLogout={()=>{}} logoUrl={siteData.logoUrl} />
          <LoginPage onLogin={r => setRole(r)} />
        </div>
      );
    }

    return (
      <div style={{ minHeight:"100vh", background:"#FDFAF6" }}>
        <NavBar page={page} loggedIn={loggedIn} isAdmin={isAdmin} navigate={navigate} onLogout={()=>{ setRole(null); navigate("home"); }} logoUrl={siteData.logoUrl} />
        {page==="home"     && <HomePage     siteData={siteData}  saveSiteData={saveSiteData} canEdit={canEdit} />}
        {page==="photos"   && <PhotosPage   siteData={siteData}  saveSiteData={saveSiteData} canEdit={canEdit} />}
        {page==="calendar" && <CalendarPage calEvents={calEvents} saveCalEvents={saveCalEvents} canEdit={canEdit} />}
        {page==="contact"  && <ContactPage  siteData={siteData}  saveSiteData={saveSiteData} canEdit={canEdit} />}
        {page==="resources" && loggedIn && (
          activeSong
            ? <SongDetail songId={activeSong} songs={songs} saveSongs={saveSongs} onBack={()=>setActiveSong(null)} canEdit={canEdit} />
            : <ResourcesDashboard songs={songs} saveSongs={saveSongs} onSelect={setActiveSong} canEdit={canEdit} />
        )}
      </div>
    );
  }

  // ── NavBar ───────────────────────────────────────────────────────────────────
  function NavBar({ page, loggedIn, isAdmin, navigate, onLogout, logoUrl }) {
    return (
      <nav style={{ background:"#2C1810", padding:"0 24px", display:"flex", alignItems:"stretch", justifyContent:"space-between", position:"sticky", top:0, zIndex:100, boxShadow:"0 2px 12px rgba(0,0,0,0.3)", minHeight:56 }}>
        <button onClick={()=>navigate("home")} style={{ background:"none", border:"none", cursor:"pointer", padding:"10px 0", display:"flex", alignItems:"center", gap:10 }}>
          {logoUrl
            ? <img src={logoUrl} alt="logo" style={{ height:34, width:34, objectFit:"contain", borderRadius:4 }} onError={e=>e.target.style.display="none"} />

          <span style={{ fontFamily:F, color:"#E8C98A", fontSize:18, fontWeight:700 }}>Golden Lotus</span>
        </button>
        <div style={{ display:"flex", alignItems:"center", gap:2 }}>
          {["home","photos","calendar","contact"].map(p=>(
            <button key={p} onClick={()=>navigate(p)} style={{ background:"none", border:"none", color:page===p?"#E8C98A":"rgba(232,201,138,0.5)", fontFamily:F, fontSize:13, fontWeight:page===p?600:400, padding:"0 12px", cursor:"pointer", height:"100%", borderBottom:page===p?"2px solid #E8C98A":"2px solid transparent", textTransform:"capitalize" }}>{p}</button>
          ))}
          <button onClick={()=>navigate("resources")} style={{ background:"none", border:"none", color:page==="resources"?"#E8C98A":"rgba(232,201,138,0.5)", fontFamily:F, fontSize:13, fontWeight:page==="resources"?600:400, padding:"0 12px", cursor:"pointer", height:"100%", borderBottom:page==="resources"?"2px solid #E8C98A":"2px solid transparent", display:"flex", alignItems:"center", gap:5 }}>🔒 Resources</button>

        </div>
      </nav>
    );

  // ── Splash ───────────────────────────────────────────────────────────────────

    return (

          {logoUrl ? <img src={logoUrl} alt="" style={{ height:64, marginBottom:12, objectFit:"contain" }} /> : <div style={{ fontSize:52, marginBottom:12 }}>🪷</div>}
          <div style={{ fontFamily:F, fontSize:24, fontWeight:700 }}>Golden Lotus</div>
          <div style={{ fontSize:13, marginTop:8, color:"#B89A6A" }}>Connecting to database…</div>
        </div>
      </div>
    );
  }

  // ── Login ────────────────────────────────────────────────────────────────────
  function LoginPage({ onLogin }) {
    const [pass,setPass]=useState(""); const [err,setErr]=useState("");
    const attempt=()=>{
      if(pass===ADMIN_PASS){onLogin("admin");return;}
      if(pass===VIEWER_PASS){onLogin("viewer");return;}
      setErr("Incorrect password. Please try again."); setPass("");
    };
    return (
      <div style={{ display:"flex", alignItems:"center", justifyContent:"center", minHeight:"calc(100vh - 56px)" }}>
        <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:20, padding:"40px 36px", width:360, maxWidth:"90vw", textAlign:"center", boxShadow:"0 8px 40px rgba(44,24,16,0.08)" }}>
          <div style={{ fontSize:36, marginBottom:12 }}>🔒</div>
          <div style={{ fontFamily:F, fontSize:24, fontWeight:700, color:"#2C1810", marginBottom:6 }}>Members Only</div>

          <input type="password" value={pass} onChange={e=>{setPass(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&attempt()} placeholder="Password" autoFocus style={{...INPUT_S,marginBottom:err?8:16,textAlign:"center",letterSpacing:"0.1em"}} />
          {err&&<div style={{fontSize:12,color:"#C0392B",marginBottom:12}}>{err}</div>}
          <button onClick={attempt} style={{...BTN,width:"100%",padding:"10px"}}>Enter</button>

  // ── Modal ────────────────────────────────────────────────────────────────────
  function Modal({ title, onClose, children, width=420 }) {
    return (
      <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.45)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:300 }} onClick={e=>e.target===e.currentTarget&&onClose()}>

    const [editing,setEditing]=useState(false); const [draft,setDraft]=useState(siteData.about||"");

      <div style={{ padding:"52px 28px", maxWidth:760, margin:"0 auto" }}>

            {siteData.logoUrl ? <img src={siteData.logoUrl} alt="Golden Lotus" style={{ height:100, maxWidth:300, objectFit:"contain" }} onError={e=>e.target.style.opacity="0.3"} /> : <div style={{ fontSize:72 }}>🪷</div>}
            {canEdit&&<button onClick={()=>{setLogoDraft(siteData.logoUrl||"");setEditLogo(true);}} title="Change logo" style={{ position:"absolute", bottom:-8, right:-8, background:"#2C1810", border:"2px solid #FFF", borderRadius:"50%", width:28, height:28, cursor:"pointer", fontSize:13, color:"#E8C98A", display:"flex", alignItems:"center", justifyContent:"center" }}>✏️</button>}

          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:18 }}>
            <SectionLabel>About Us</SectionLabel>
            {canEdit&&!editing&&<button onClick={()=>{setDraft(siteData.about||"");setEditing(true);}} style={BTN_GHOST}>Edit</button>}

          {editing ? (
            <>
              <textarea value={draft} onChange={e=>setDraft(e.target.value)} style={{ width:"100%", border:"0.5px solid #E0D4C0", borderRadius:8, padding:"12px 14px", fontSize:15, fontFamily:F, resize:"vertical", minHeight:220, background:"#FDFAF6", color:"#2C1810", outline:"none", boxSizing:"border-box", lineHeight:1.8 }} />

      </div>

    const [showAdd,setShowAdd]=useState(false); const [lightbox,setLightbox]=useState(null); const [editPhoto,setEditPhoto]=useState(null);
    const [newUrl,setNewUrl]=useState(""); const [newCap,setNewCap]=useState(""); const [newEvent,setNewEvent]=useState(""); const [newYear,setNewYear]=useState(String(new Date().getFullYear()));

    const groups={};
    photos.forEach(p=>{ const k=[p.year,p.eventLabel].filter(Boolean).join(" — ")||"Uncategorized"; if(!groups[k])groups[k]=[]; groups[k].push(p); });
    const groupKeys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));

    const addPhoto=()=>{
      if(!newUrl.trim())return;
      saveSiteData({...siteData,photos:[...photos,{id:Date.now().toString(),url:newUrl.trim(),caption:newCap.trim(),eventLabel:newEvent.trim(),year:newYear.trim()}]});
      setNewUrl("");setNewCap("");setNewEvent("");setNewYear(String(new Date().getFullYear()));setShowAdd(false);
    };
    const deletePhoto=(id)=>{ if(!window.confirm("Delete this photo?"))return; saveSiteData({...siteData,photos:photos.filter(p=>p.id!==id)}); setLightbox(null); };
    const saveEdit=()=>{ saveSiteData({...siteData,photos:photos.map(p=>p.id===editPhoto.id?{...p,...editPhoto}:p)}); setEditPhoto(null); };

    return (

          {canEdit&&<button onClick={()=>setShowAdd(true)} style={BTN}>+ Add photo</button>}
        </div>

          <div style={{ textAlign:"center", padding:"60px 0", color:"#B89A6A" }}>

          <div key={gk} style={{ marginBottom:36 }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>

  // ── Calendar Page ─────────────────────────────────────────────────────────────
  function CalendarPage({ calEvents, saveCalEvents, canEdit }) {
    const today=new Date();
    const [viewYear,setViewYear]=useState(today.getFullYear()); const [viewMonth,setViewMonth]=useState(today.getMonth());
    const [selected,setSelected]=useState(null);
    const [showAdd,setShowAdd]=useState(false); const [newTitle,setNewTitle]=useState(""); const [newType,setNewType]=useState("Practice"); const [newTime,setNewTime]=useState(""); const [newNote,setNewNote]=useState("");
    const [editEvt,setEditEvt]=useState(null);

    const prevMonth=()=>{ if(viewMonth===0){setViewYear(y=>y-1);setViewMonth(11);}else setViewMonth(m=>m-1); };
    const nextMonth=()=>{ if(viewMonth===11){setViewYear(y=>y+1);setViewMonth(0);}else setViewMonth(m=>m+1); };
    const days=daysInMonth(viewYear,viewMonth); const firstDay=firstDayOfMonth(viewYear,viewMonth);

    const addEvent=()=>{
      if(!selected||!newTitle.trim())return;
      const ev={id:Date.now().toString(),title:newTitle.trim(),type:newType,time:newTime.trim(),note:newNote.trim()};
      const prev=calEvents[selected]||[];
      saveCalEvents({...calEvents,[selected]:[...prev,ev]});
      setNewTitle("");setNewType("Practice");setNewTime("");setNewNote("");setShowAdd(false);
    };
    const deleteEvent=(dateKey,evId)=>{
      if(!window.confirm("Delete this event?"))return;
      const updated=(calEvents[dateKey]||[]).filter(e=>e.id!==evId);
      const next={...calEvents};
      if(updated.length)next[dateKey]=updated; else delete next[dateKey];
      saveCalEvents(next);
    };
    const saveEdit=()=>{
      const updated=(calEvents[editEvt.dateKey]||[]).map(e=>e.id===editEvt.id?{...e,title:editEvt.title,type:editEvt.type,time:editEvt.time,note:editEvt.note}:e);
      saveCalEvents({...calEvents,[editEvt.dateKey]:updated}); setEditEvt(null);
    };

    const selectedEvents=selected?(calEvents[selected]||[]):[];
    const todayKey=toDateKey(today.getFullYear(),today.getMonth(),today.getDate());
    const upcoming=Object.entries(calEvents).filter(([k])=>k>=todayKey).sort(([a],[b])=>a.localeCompare(b)).slice(0,8).flatMap(([dateKey,evs])=>evs.map(e=>({...e,dateKey})));

    return (
      <div style={{ padding:"28px", maxWidth:1100, margin:"0 auto" }}>
        <div style={{ fontFamily:F, fontSize:26, fontWeight:700, color:"#2C1810", marginBottom:4 }}>Calendar</div>
        <div style={{ fontSize:13, color:"#8B7355", marginBottom:24 }}>Practice &amp; performance schedule</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 320px", gap:20, alignItems:"start" }}>
          {/* Grid */}
          <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:16, overflow:"hidden" }}>
            <div style={{ background:"#2C1810", padding:"14px 20px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <button onClick={prevMonth} style={{ background:"none", border:"none", color:"#E8C98A", fontSize:20, cursor:"pointer", padding:"0 6px" }}>‹</button>
              <div style={{ fontFamily:F, color:"#E8C98A", fontSize:16, fontWeight:600 }}>{MONTH_NAMES[viewMonth]} {viewYear}</div>
              <button onClick={nextMonth} style={{ background:"none", border:"none", color:"#E8C98A", fontSize:20, cursor:"pointer", padding:"0 6px" }}>›</button>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", background:"#F9F4ED" }}>
              {DAY_NAMES.map(d=><div key={d} style={{ padding:"8px 0", textAlign:"center", fontSize:11, fontWeight:600, color:"#8B7355", letterSpacing:"0.5px" }}>{d}</div>)}
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:"0.5px", background:"#EEE5D8" }}>
              {Array.from({length:firstDay}).map((_,i)=><div key={`e${i}`} style={{ background:"#FDFAF6", minHeight:72 }} />)}
              {Array.from({length:days}).map((_,i)=>{
                const d=i+1, key=toDateKey(viewYear,viewMonth,d), evs=calEvents[key]||[];
                const isToday=key===todayKey, isSel=key===selected;
                return (
                  <div key={d} onClick={()=>setSelected(isSel?null:key)} style={{ background:isSel?"#F9F0E4":isToday?"#FFF8F0":"#FFF", minHeight:72, padding:"6px 8px", cursor:"pointer", borderTop:isSel?"2px solid #8B4513":"2px solid transparent" }}>
                    <div style={{ fontSize:12, fontWeight:isToday?700:400, color:isToday||isSel?"#8B4513":"#5A3E28", marginBottom:3 }}>{d}</div>
                    {evs.slice(0,3).map(ev=>{ const c=CAL_COLORS[ev.type]||CAL_COLORS.Other; return <div key={ev.id} style={{ fontSize:10, background:c.bg, color:c.color, borderRadius:4, padding:"1px 5px", marginBottom:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", fontWeight:500 }}>{ev.title}</div>; })}
                    {evs.length>3&&<div style={{ fontSize:10, color:"#B89A6A" }}>+{evs.length-3}</div>}
                  </div>
                );
              })}
            </div>
          </div>
          {/* Sidebar */}
          <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
            <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:14, overflow:"hidden" }}>
              <div style={{ padding:"12px 16px", borderBottom:"0.5px solid #EEE5D8", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                <div style={{ fontSize:13, fontWeight:600, color:"#2C1810" }}>{selected?(()=>{ const [y,m,d]=selected.split("-"); return `${MONTH_NAMES[parseInt(m)-1]} ${parseInt(d)}, ${y}`; })():"Select a day"}</div>
                {canEdit&&selected&&<button onClick={()=>setShowAdd(true)} style={{...BTN,padding:"4px 12px",fontSize:12}}>+ Add</button>}
              </div>
              {!selected&&<div style={{ padding:"20px 16px", fontSize:13, color:"#B89A6A", textAlign:"center" }}>Click a date to view or add events</div>}
              {selected&&selectedEvents.length===0&&<div style={{ padding:"16px", fontSize:12, color:"#B89A6A", textAlign:"center" }}>No events{canEdit?" — click + Add":""}</div>}
              {selectedEvents.map(ev=>{ const c=CAL_COLORS[ev.type]||CAL_COLORS.Other; return (
                <div key={ev.id} style={{ padding:"10px 16px", borderBottom:"0.5px solid #F5EDE0" }}>
                  <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:8 }}>
                    <div><span style={{ fontSize:10, background:c.bg, color:c.color, borderRadius:20, padding:"1px 8px", fontWeight:600, marginRight:6 }}>{ev.type}</span><span style={{ fontSize:13, fontWeight:600, color:"#2C1810" }}>{ev.title}</span>{ev.time&&<span style={{ fontSize:12, color:"#8B7355", marginLeft:6 }}>· {ev.time}</span>}</div>
                    {canEdit&&<div style={{ display:"flex", gap:4, flexShrink:0 }}><button onClick={()=>setEditEvt({...ev,dateKey:selected})} style={{ background:"none", border:"none", cursor:"pointer", fontSize:13, color:"#B89A6A" }}>✏️</button><button onClick={()=>deleteEvent(selected,ev.id)} style={{ background:"none", border:"none", cursor:"pointer", fontSize:13, color:"#CC6644" }}>🗑</button></div>}
                  </div>
                  {ev.note&&<div style={{ fontSize:12, color:"#8B7355", marginTop:4, lineHeight:1.5 }}>{ev.note}</div>}
                </div>
              );})}
            </div>
            <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:14, overflow:"hidden" }}>
              <div style={{ padding:"12px 16px", borderBottom:"0.5px solid #EEE5D8" }}><div style={{ fontSize:13, fontWeight:600, color:"#2C1810" }}>Upcoming</div></div>
              {upcoming.length===0&&<div style={{ padding:"16px", fontSize:12, color:"#B89A6A", textAlign:"center" }}>No upcoming events</div>}
              {upcoming.map((ev,i)=>{ const c=CAL_COLORS[ev.type]||CAL_COLORS.Other; const [y,m,d]=ev.dateKey.split("-"); return (
                <div key={`${ev.id}-${i}`} onClick={()=>{ const [y,m,d]=ev.dateKey.split("-"); setViewYear(parseInt(y));setViewMonth(parseInt(m)-1);setSelected(ev.dateKey); }} style={{ padding:"8px 16px", borderBottom:"0.5px solid #F5EDE0", cursor:"pointer", display:"flex", gap:10, alignItems:"flex-start" }}
                  onMouseEnter={e=>e.currentTarget.style.background="#FBF6EF"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <div style={{ flexShrink:0, textAlign:"center", minWidth:38, background:"#F9F0E4", borderRadius:8, padding:"3px 0" }}>
                    <div style={{ fontSize:9, fontWeight:700, color:"#8B7355", textTransform:"uppercase" }}>{MONTH_NAMES[parseInt(m)-1].slice(0,3)}</div>
                    <div style={{ fontSize:16, fontWeight:700, color:"#2C1810", lineHeight:1.2 }}>{parseInt(d)}</div>
                  </div>
                  <div><div style={{ fontSize:12, fontWeight:600, color:"#2C1810" }}>{ev.title}</div><div style={{ fontSize:11, color:c.color }}>{ev.type}{ev.time?` · ${ev.time}`:""}</div></div>
                </div>
              );})}
            </div>
            <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:14, padding:"12px 16px" }}>
              <SectionLabel>Legend</SectionLabel>
              <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                {CAL_EVENT_TYPES.map(t=>{ const c=CAL_COLORS[t]; return <span key={t} style={{ fontSize:11, background:c.bg, color:c.color, padding:"2px 10px", borderRadius:20, fontWeight:500 }}>{t}</span>; })}
              </div>
            </div>
          </div>
        </div>
        {showAdd&&selected&&(
          <Modal title={`Add Event — ${(()=>{ const [y,m,d]=selected.split("-"); return `${MONTH_NAMES[parseInt(m)-1]} ${parseInt(d)}, ${y}`; })()}`} onClose={()=>setShowAdd(false)}>
            <div style={{ marginBottom:12 }}><SectionLabel>Event title</SectionLabel><input autoFocus value={newTitle} onChange={e=>setNewTitle(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addEvent()} placeholder="e.g. Rehearsal at the temple" style={INPUT_S} /></div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:12 }}>
              <div><SectionLabel>Type</SectionLabel><select value={newType} onChange={e=>setNewType(e.target.value)} style={{...INPUT_S,background:"#FFF"}}>{CAL_EVENT_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
              <div><SectionLabel>Time (optional)</SectionLabel><input value={newTime} onChange={e=>setNewTime(e.target.value)} placeholder="10:00 AM" style={INPUT_S} /></div>
            </div>
            <div style={{ marginBottom:16 }}><SectionLabel>Notes (optional)</SectionLabel><textarea value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Location, what to bring…" style={{ width:"100%", border:"0.5px solid #D4B896", borderRadius:8, padding:"9px 12px", fontSize:13, fontFamily:F, resize:"vertical", minHeight:70, outline:"none", boxSizing:"border-box" }} /></div>
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}><button onClick={()=>setShowAdd(false)} style={BTN_GHOST}>Cancel</button><button onClick={addEvent} style={BTN}>Add</button></div>
          </Modal>
        )}
        {editEvt&&(
          <Modal title="Edit Event" onClose={()=>setEditEvt(null)}>
            <div style={{ marginBottom:12 }}><SectionLabel>Title</SectionLabel><input value={editEvt.title} onChange={e=>setEditEvt({...editEvt,title:e.target.value})} style={INPUT_S} /></div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:12 }}>
              <div><SectionLabel>Type</SectionLabel><select value={editEvt.type} onChange={e=>setEditEvt({...editEvt,type:e.target.value})} style={{...INPUT_S,background:"#FFF"}}>{CAL_EVENT_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
              <div><SectionLabel>Time</SectionLabel><input value={editEvt.time||""} onChange={e=>setEditEvt({...editEvt,time:e.target.value})} style={INPUT_S} /></div>
            </div>
            <div style={{ marginBottom:16 }}><SectionLabel>Notes</SectionLabel><textarea value={editEvt.note||""} onChange={e=>setEditEvt({...editEvt,note:e.target.value})} style={{ width:"100%", border:"0.5px solid #D4B896", borderRadius:8, padding:"9px 12px", fontSize:13, fontFamily:F, resize:"vertical", minHeight:70, outline:"none", boxSizing:"border-box" }} /></div>
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}><button onClick={()=>setEditEvt(null)} style={BTN_GHOST}>Cancel</button><button onClick={saveEdit} style={BTN}>Save</button></div>
          </Modal>
        )}
      </div>
    );
  }

  // ── Contact Page ──────────────────────────────────────────────────────────────

          <div style={{ fontFamily:F, fontSize:32, fontWeight:700, color:"#2C1810" }}>Contact Us</div>
        </div>
        <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:16, padding:32 }}>

  // ── Resources Dashboard ───────────────────────────────────────────────────────
  function ResourcesDashboard({ songs, saveSongs, onSelect, canEdit }) {
    const [search,setSearch]=useState(""); const [showAdd,setShowAdd]=useState(false); const [newTitle,setNewTitle]=useState("");
    const filtered=songs.filter(s=>s.title.toLowerCase().includes(search.toLowerCase()));
    const addSong=()=>{
      if(!newTitle.trim())return;
      saveSongs([...songs,{id:Date.now().toString(),title:newTitle.trim(),eventTags:[],performed:"Not yet",about:"",videos:[],lyrics:{vi:"",en:""},coverUrl:""}]);
      setNewTitle(""); setShowAdd(false);
    };
    const deleteSong=(id)=>{ if(!window.confirm("Delete this song and all its data?"))return; saveSongs(songs.filter(s=>s.id!==id)); };
    return (
      <div style={{ padding:"28px" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:24 }}>
          <div><div style={{ fontFamily:F, fontSize:26, fontWeight:700, color:"#2C1810" }}>Resources</div><div style={{ fontSize:13, color:"#8B7355", marginTop:3 }}>{songs.length} song{songs.length!==1?"s":""}</div></div>
          <div style={{ display:"flex", gap:10 }}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search songs…" style={{ border:"0.5px solid #D4B896", borderRadius:8, padding:"7px 14px", fontSize:13, outline:"none", background:"#FFF", width:190, fontFamily:F }} />
            {canEdit&&<button onClick={()=>setShowAdd(true)} style={{...BTN,whiteSpace:"nowrap"}}>+ Add song</button>}
          </div>
        </div>
        {filtered.length===0&&!search&&(
          <div style={{ textAlign:"center", padding:"70px 0", color:"#B89A6A" }}>
            <div style={{ fontSize:52, marginBottom:14 }}>🪷</div>
            <div style={{ fontFamily:F, fontSize:22, fontWeight:700, marginBottom:10, color:"#5A3E28" }}>No songs yet</div>
            {canEdit&&<><div style={{ fontSize:14, marginBottom:22 }}>Add your first song to get started</div><button onClick={()=>setShowAdd(true)} style={BTN}>+ Add song</button></>}
          </div>
        )}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))", gap:14 }}>
          {filtered.map(song=><SongCard key={song.id} song={song} onClick={()=>onSelect(song.id)} onDelete={canEdit?()=>deleteSong(song.id):null} />)}
          {canEdit&&songs.length>0&&<div onClick={()=>setShowAdd(true)} style={{ border:"1.5px dashed #D4B896", borderRadius:14, display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column", gap:6, minHeight:170, cursor:"pointer", color:"#B89A6A", fontSize:13 }}><div style={{ fontSize:28 }}>+</div><div>Add song</div></div>}
        </div>
        {showAdd&&<Modal title="New Song" onClose={()=>setShowAdd(false)}><input autoFocus value={newTitle} onChange={e=>setNewTitle(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addSong()} placeholder="Song title…" style={INPUT_S} /><div style={{ display:"flex", gap:8, marginTop:16, justifyContent:"flex-end" }}><button onClick={()=>setShowAdd(false)} style={BTN_GHOST}>Cancel</button><button onClick={addSong} style={BTN}>Create</button></div></Modal>}
      </div>
    );
  }

  // ── Song Card ─────────────────────────────────────────────────────────────────
  function SongCard({ song, onClick, onDelete }) {
    const perfKey=song.performed.startsWith("Performed")?"Performed":song.performed;
    const perfC=PERFORMED_COLORS[perfKey]||PERFORMED_COLORS["Not yet"];
    return (
      <div onClick={onClick} style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:14, overflow:"hidden", cursor:"pointer", position:"relative", transition:"box-shadow 0.15s" }}
        onMouseEnter={e=>e.currentTarget.style.boxShadow="0 4px 24px rgba(44,24,16,0.12)"} onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
        {onDelete&&<button onClick={e=>{e.stopPropagation();onDelete();}} title="Delete" style={{ position:"absolute", top:8, right:8, background:"rgba(0,0,0,0.4)", border:"none", cursor:"pointer", color:"#FFF", fontSize:15, lineHeight:1, padding:"2px 6px", borderRadius:20, zIndex:1 }}>×</button>}
        <div style={{ width:"100%", height:100, background:"linear-gradient(135deg,#F9F0E4 0%,#F0E0C8 100%)", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden" }}>
          {song.coverUrl?<img src={song.coverUrl} alt={song.title} style={{ width:"100%", height:"100%", objectFit:"cover" }} onError={e=>e.target.style.display="none"} />:<span style={{ fontSize:32 }}>🪷</span>}
        </div>
        <div style={{ padding:"12px 14px 12px" }}>
          <div style={{ fontFamily:F, fontSize:14, fontWeight:600, color:"#2C1810", lineHeight:1.4, marginBottom:8, paddingRight:8 }}>{song.title}</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:4, marginBottom:8 }}>
            {song.eventTags.map(t=>{ const c=TAG_COLORS[t]||TAG_COLORS.Other; return <span key={t} style={{ fontSize:10, background:c.bg, color:c.color, padding:"2px 7px", borderRadius:20, fontWeight:600 }}>{t}</span>; })}
          </div>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <span style={{ fontSize:10, background:perfC.bg, color:perfC.color, padding:"2px 7px", borderRadius:20, fontWeight:600 }}>{song.performed}</span>
            <span style={{ fontSize:11, color:"#B89A6A" }}>{song.videos.length} video{song.videos.length!==1?"s":""}</span>
          </div>
        </div>
      </div>
    );
  }

  // ── Song Detail ───────────────────────────────────────────────────────────────
  function SongDetail({ songId, songs, saveSongs, onBack, canEdit }) {
    const [activeTab,setActiveTab]=useState("videos"); const [activeVideoIdx,setActiveVideoIdx]=useState(0);
    const song=songs.find(s=>s.id===songId); if(!song)return null;
    const updateSong=(patch)=>saveSongs(songs.map(s=>s.id===songId?{...s,...patch}:s));
    const video=song.videos[activeVideoIdx]||null;
    return (
      <div>
        <div style={{ background:"#2C1810", padding:"14px 28px" }}>
          <button onClick={onBack} style={{ background:"none", border:"none", color:"rgba(232,201,138,0.6)", cursor:"pointer", fontSize:13, padding:0, fontFamily:F, marginBottom:8 }}>← Back to Resources</button>
          <div style={{ display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
            {song.coverUrl&&<img src={song.coverUrl} alt="" style={{ width:40, height:40, borderRadius:8, objectFit:"cover", border:"1.5px solid rgba(232,201,138,0.3)" }} onError={e=>e.target.style.display="none"} />}
            <div>
              <div style={{ fontFamily:F, color:"#E8C98A", fontSize:22, fontWeight:700 }}>{song.title}</div>
              <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:4 }}>{song.eventTags.map(t=><span key={t} style={{ fontSize:11, background:"rgba(255,255,255,0.12)", color:"rgba(232,201,138,0.85)", padding:"2px 8px", borderRadius:20 }}>{t}</span>)}</div>
            </div>
          </div>
          <div style={{ display:"flex", marginTop:14 }}>
            {["videos","lyrics","about"].map(t=><button key={t} onClick={()=>setActiveTab(t)} style={{ background:"none", border:"none", borderBottom:activeTab===t?"2px solid #E8C98A":"2px solid transparent", color:activeTab===t?"#E8C98A":"rgba(232,201,138,0.45)", fontFamily:F, fontSize:13, fontWeight:500, padding:"6px 18px 8px", cursor:"pointer", textTransform:"capitalize" }}>{t}</button>)}
          </div>
        </div>
        <div style={{ padding:"20px 28px" }}>
          {activeTab==="videos"&&<VideosTab song={song} activeVideoIdx={activeVideoIdx} setActiveVideoIdx={setActiveVideoIdx} video={video} updateSong={updateSong} canEdit={canEdit} />}
          {activeTab==="lyrics"&&<LyricsTab song={song} updateSong={updateSong} canEdit={canEdit} />}
          {activeTab==="about" &&<AboutTab  song={song} updateSong={updateSong} canEdit={canEdit} />}
        </div>
      </div>
    );
  }

  // ── Videos Tab ────────────────────────────────────────────────────────────────
  function VideosTab({ song, activeVideoIdx, setActiveVideoIdx, video, updateSong, canEdit }) {
    const [showAdd,setShowAdd]=useState(false); const [editingVideo,setEditingVideo]=useState(null);
    const [newUrl,setNewUrl]=useState(""); const [newLabel,setNewLabel]=useState(""); const [newColor,setNewColor]=useState(VIDEO_COLORS[0]);
    const [tsTime,setTsTime]=useState(""); const [tsLabel,setTsLabel]=useState("");
    const iframeRef=useRef(null);

    const addVideo=()=>{ const ytId=parseYouTubeId(newUrl); if(!ytId){alert("Couldn't find a YouTube ID.");return;} const vid={id:Date.now().toString(),url:newUrl.trim(),label:newLabel.trim()||`Video ${song.videos.length+1}`,color:newColor,timestamps:[],notes:""}; const updated=[...song.videos,vid]; updateSong({videos:updated}); setActiveVideoIdx(updated.length-1); setNewUrl("");setNewLabel("");setNewColor(VIDEO_COLORS[0]);setShowAdd(false); };
    const saveEdit=()=>{ const ytId=parseYouTubeId(editingVideo.url); if(!ytId){alert("Couldn't find a YouTube ID.");return;} updateSong({videos:song.videos.map((v,i)=>i===editingVideo.idx?{...v,url:editingVideo.url.trim(),label:editingVideo.label.trim()||v.label,color:editingVideo.color}:v)}); setEditingVideo(null); };
    const deleteVideo=(idx)=>{ if(!window.confirm("Delete this video?"))return; const updated=song.videos.filter((_,i)=>i!==idx); updateSong({videos:updated}); setActiveVideoIdx(Math.max(0,idx-1)); };
    const updateVideo=(patch)=>updateSong({videos:song.videos.map((v,i)=>i===activeVideoIdx?{...v,...patch}:v)});
    const addTimestamp=()=>{ const secs=parseTime(tsTime); if(isNaN(secs)){alert("Use m:ss format");return;} if(!tsLabel.trim()){alert("Please add a label");return;} const sorted=[...(video?.timestamps||[]),{id:Date.now().toString(),time:secs,label:tsLabel.trim()}].sort((a,b)=>a.time-b.time); updateVideo({timestamps:sorted}); setTsTime("");setTsLabel(""); };
    const removeTimestamp=(tsId)=>updateVideo({timestamps:video.timestamps.filter(t=>t.id!==tsId)});
    const seekTo=(seconds)=>{ if(iframeRef.current){ iframeRef.current.contentWindow.postMessage(JSON.stringify({event:"command",func:"seekTo",args:[seconds,true]}),"*"); iframeRef.current.contentWindow.postMessage(JSON.stringify({event:"command",func:"playVideo"}),"*"); } };
    const ytId=video?parseYouTubeId(video.url):null; const tabColor=video?.color||VIDEO_COLORS[0];

    const ColorPicker=({value,onChange})=>(
      <div>
        <SectionLabel>Tab color</SectionLabel>
        <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:6 }}>
          {VIDEO_COLORS.map((col,i)=><button key={col} onClick={()=>onChange(col)} title={VIDEO_COLOR_LABELS[i]} style={{ width:28, height:28, borderRadius:"50%", background:col, border:value===col?"3px solid #2C1810":"2px solid transparent", cursor:"pointer", outline:"none" }} />)}
        </div>
        <div style={{ fontSize:11, color:"#B89A6A" }}>{VIDEO_COLOR_LABELS[VIDEO_COLORS.indexOf(value)]||""}</div>
      </div>
    );

    return (
      <div>
        <div style={{ display:"flex", gap:8, marginBottom:16, flexWrap:"wrap", alignItems:"center" }}>
          {song.videos.map((v,i)=>{ const col=v.color||VIDEO_COLORS[0],isActive=activeVideoIdx===i; return (
            <div key={v.id} style={{ display:"flex", alignItems:"stretch" }}>
              <button onClick={()=>setActiveVideoIdx(i)} style={{ fontSize:12, padding:"5px 12px", cursor:"pointer", fontFamily:F, border:`1.5px solid ${isActive?col:"#D4B896"}`, borderRight:"none", borderRadius:"20px 0 0 20px", background:isActive?hex2rgba(col,0.12):"transparent", color:isActive?col:"#8B7355", fontWeight:isActive?600:400 }}>
                <span style={{ display:"inline-block", width:8, height:8, borderRadius:"50%", background:col, marginRight:6, verticalAlign:"middle" }} />{v.label}
              </button>
              {canEdit&&<><button onClick={()=>setEditingVideo({idx:i,url:v.url,label:v.label,color:v.color||VIDEO_COLORS[0]})} title="Edit" style={{ fontSize:11, padding:"5px 7px", cursor:"pointer", border:`1.5px solid ${isActive?col:"#D4B896"}`, borderLeft:"0.5px solid #E8DCCC", borderRight:"none", background:isActive?hex2rgba(col,0.08):"transparent", color:isActive?col:"#B89A6A" }}>✏️</button><button onClick={()=>deleteVideo(i)} title="Delete" style={{ fontSize:11, padding:"5px 7px", cursor:"pointer", border:`1.5px solid ${isActive?col:"#D4B896"}`, borderLeft:"0.5px solid #E8DCCC", borderRadius:"0 20px 20px 0", background:isActive?hex2rgba(col,0.08):"transparent", color:"#CC6644" }}>🗑</button></>}
            </div>
          );})}
          {canEdit&&<button onClick={()=>setShowAdd(true)} style={{ fontSize:12, padding:"5px 14px", borderRadius:20, cursor:"pointer", fontFamily:F, border:"1px dashed #D4B896", background:"transparent", color:"#B89A6A" }}>+ Add video</button>}
        </div>
        {song.videos.length===0?(
          <div style={{ textAlign:"center", padding:"70px 0", color:"#B89A6A" }}>
            <div style={{ fontSize:38, marginBottom:14 }}>🎬</div>
            <div style={{ fontSize:14, marginBottom:18 }}>No videos yet{canEdit?" — paste a YouTube URL to add one":""}</div>
            {canEdit&&<button onClick={()=>setShowAdd(true)} style={BTN}>+ Add video</button>}
          </div>
        ):(
          <div style={{ display:"grid", gridTemplateColumns:"1fr 280px", gap:16, alignItems:"start" }}>
            <div>
              {ytId?(
                <div style={{ position:"relative", paddingBottom:"56.25%", height:0, borderRadius:12, overflow:"hidden", background:"#111", marginBottom:14, boxShadow:`0 0 0 2px ${tabColor}` }}>
                  <iframe key={`${video.id}-${ytId}`} ref={iframeRef} src={`https://www.youtube-nocookie.com/embed/${ytId}?enablejsapi=1&rel=0`} style={{ position:"absolute", top:0, left:0, width:"100%", height:"100%", border:"none" }} allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowFullScreen />
                </div>
              ):(
                <div style={{ background:"#2a1a12", borderRadius:12, aspectRatio:"16/9", display:"flex", alignItems:"center", justifyContent:"center", color:"#CC6644", marginBottom:14, fontSize:13 }}>⚠️ Could not load video — check the URL</div>
              )}
              <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:12, padding:16 }}>
                <SectionLabel>Notes — {video?.label}</SectionLabel>
                <textarea value={video?.notes||""} onChange={e=>canEdit&&updateVideo({notes:e.target.value})} readOnly={!canEdit} placeholder={canEdit?"Add notes about this video…":"No notes."} style={{ width:"100%", border:"0.5px solid #E0D4C0", borderRadius:8, padding:"10px 12px", fontSize:13, fontFamily:F, resize:"vertical", minHeight:110, background:canEdit?"#FDFAF6":"#F8F4EE", boxSizing:"border-box", color:"#2C1810", outline:"none" }} />
              </div>
            </div>
            <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:12, overflow:"hidden" }}>
              <div style={{ padding:"12px 16px", borderBottom:"0.5px solid #EEE5D8", background:hex2rgba(tabColor,0.08) }}>
                <div style={{ fontSize:11, fontWeight:600, color:tabColor, letterSpacing:"0.8px", textTransform:"uppercase" }}>Timestamps</div>
              </div>
              {(video?.timestamps||[]).length===0&&<div style={{ padding:16, fontSize:12, color:"#B89A6A", textAlign:"center" }}>No timestamps yet</div>}
              {(video?.timestamps||[]).map(ts=>(
                <div key={ts.id} onClick={()=>seekTo(ts.time)} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 14px", borderBottom:"0.5px solid #F5EDE0", cursor:"pointer" }}
                  onMouseEnter={e=>e.currentTarget.style.background="#FBF6EF"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <span style={{ fontSize:11, fontWeight:600, background:hex2rgba(tabColor,0.12), color:tabColor, padding:"2px 8px", borderRadius:20, minWidth:40, textAlign:"center", fontFamily:"monospace" }}>{formatTime(ts.time)}</span>
                  <span style={{ flex:1, fontSize:12, color:"#5A3E28", fontFamily:F }}>{ts.label}</span>
                  {canEdit&&<button onClick={e=>{e.stopPropagation();removeTimestamp(ts.id);}} style={{ background:"none", border:"none", cursor:"pointer", color:"#C4A882", fontSize:15, padding:0, lineHeight:1 }}>×</button>}
                </div>
              ))}
              {canEdit&&(
                <div style={{ padding:"10px 14px", borderTop:"0.5px solid #EEE5D8", background:"#FBF8F4" }}>
                  <SectionLabel>Add timestamp</SectionLabel>
                  <div style={{ display:"flex", gap:6, marginBottom:6 }}>
                    <input value={tsTime} onChange={e=>setTsTime(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTimestamp()} placeholder="1:32" style={{ width:54, fontSize:12, border:"0.5px solid #D4B896", borderRadius:6, padding:"5px 8px", fontFamily:"monospace", background:"#FFF", outline:"none" }} />
                    <input value={tsLabel} onChange={e=>setTsLabel(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTimestamp()} placeholder="Label…" style={{ flex:1, fontSize:12, border:"0.5px solid #D4B896", borderRadius:6, padding:"5px 8px", fontFamily:F, background:"#FFF", outline:"none" }} />
                  </div>
                  <button onClick={addTimestamp} style={{ width:"100%", background:"#2C1810", color:"#E8C98A", border:"none", borderRadius:6, padding:"6px", fontSize:12, cursor:"pointer", fontFamily:F, fontWeight:600 }}>Add</button>
                </div>
              )}
            </div>
          </div>
        )}
        {showAdd&&<Modal title="Add YouTube Video" onClose={()=>{setShowAdd(false);setNewUrl("");setNewLabel("");}}><div style={{ marginBottom:12 }}><SectionLabel>YouTube URL</SectionLabel><input autoFocus value={newUrl} onChange={e=>setNewUrl(e.target.value)} placeholder="https://www.youtube.com/watch?v=…" style={INPUT_S} /></div><div style={{ marginBottom:12 }}><SectionLabel>Label (optional)</SectionLabel><input value={newLabel} onChange={e=>setNewLabel(e.target.value)} placeholder={`Video ${song.videos.length+1}`} style={INPUT_S} /></div><div style={{ marginBottom:20 }}><ColorPicker value={newColor} onChange={setNewColor} /></div><div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}><button onClick={()=>{setShowAdd(false);setNewUrl("");setNewLabel("");}} style={BTN_GHOST}>Cancel</button><button onClick={addVideo} style={BTN}>Add</button></div></Modal>}
        {editingVideo&&<Modal title="Edit Video" onClose={()=>setEditingVideo(null)}><div style={{ marginBottom:12 }}><SectionLabel>YouTube URL</SectionLabel><input autoFocus value={editingVideo.url} onChange={e=>setEditingVideo({...editingVideo,url:e.target.value})} style={INPUT_S} /></div><div style={{ marginBottom:12 }}><SectionLabel>Label</SectionLabel><input value={editingVideo.label} onChange={e=>setEditingVideo({...editingVideo,label:e.target.value})} style={INPUT_S} /></div><div style={{ marginBottom:20 }}><ColorPicker value={editingVideo.color} onChange={c=>setEditingVideo({...editingVideo,color:c})} /></div><div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}><button onClick={()=>setEditingVideo(null)} style={BTN_GHOST}>Cancel</button><button onClick={saveEdit} style={BTN}>Save</button></div></Modal>}
      </div>
    );
  }

  // ── Lyrics Tab ────────────────────────────────────────────────────────────────
  function LyricsTab({ song, updateSong, canEdit }) {
    const viRef=useRef(null),enRef=useRef(null),syncing=useRef(false);
    const syncScroll=(src,tgt)=>{ if(syncing.current)return; syncing.current=true; const pct=src.scrollTop/(src.scrollHeight-src.clientHeight||1); tgt.scrollTop=pct*(tgt.scrollHeight-tgt.clientHeight); requestAnimationFrame(()=>{syncing.current=false;}); };
    useEffect(()=>{ const vi=viRef.current,en=enRef.current; if(!vi||!en)return; const onVi=()=>syncScroll(vi,en),onEn=()=>syncScroll(en,vi); vi.addEventListener("scroll",onVi);en.addEventListener("scroll",onEn); return()=>{vi.removeEventListener("scroll",onVi);en.removeEventListener("scroll",onEn);}; },[]);
    return (
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, height:"calc(100vh - 230px)", minHeight:400 }}>
        {[["vi","Tiếng Việt",viRef],["en","English Translation",enRef]].map(([key,label,ref])=>(
          <div key={key} style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:12, overflow:"hidden", display:"flex", flexDirection:"column" }}>
            <div style={{ padding:"12px 16px", borderBottom:"0.5px solid #EEE5D8", display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
              <span style={{ fontSize:11, background:key==="vi"?"#FFE8E0":"#E8F0FF", color:key==="vi"?"#8B3A1A":"#1A3A8B", padding:"2px 8px", borderRadius:20, fontWeight:600 }}>{key==="vi"?"VI":"EN"}</span>
              <span style={{ fontSize:13, fontWeight:600, color:"#5A3E28", fontFamily:F }}>{label}</span>
            </div>
            <textarea ref={ref} value={song.lyrics[key]||""} readOnly={!canEdit} onChange={e=>canEdit&&updateSong({lyrics:{...song.lyrics,[key]:e.target.value}})} placeholder={canEdit?`Enter ${label.toLowerCase()}…`:"No lyrics yet."} style={{ flex:1, width:"100%", border:"none", padding:"14px 16px", fontSize:14, fontFamily:F, resize:"none", background:canEdit?"transparent":"#FAFAF7", color:"#2C1810", outline:"none", boxSizing:"border-box", lineHeight:2, overflowY:"auto" }} />
          </div>
        ))}
      </div>
    );
  }

  // ── About Tab ─────────────────────────────────────────────────────────────────
  function AboutTab({ song, updateSong, canEdit }) {
    const [editingCover,setEditingCover]=useState(false); const [coverDraft,setCoverDraft]=useState(song.coverUrl||"");
    const perfKey=song.performed.startsWith("Performed")?"Performed":song.performed;
    const year=song.performed.startsWith("Performed ")?song.performed.replace("Performed ",""):"";
    const saveCover=()=>{updateSong({coverUrl:coverDraft.trim()});setEditingCover(false);};
    const toggleTag=(tag)=>{ if(!canEdit)return; const tags=song.eventTags.includes(tag)?song.eventTags.filter(t=>t!==tag):[...song.eventTags,tag]; updateSong({eventTags:tags}); };
    return (
      <div style={{ maxWidth:700 }}>
        <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:12, padding:22, marginBottom:16 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
            <SectionLabel>Cover Image</SectionLabel>
            {canEdit&&!editingCover&&<button onClick={()=>{setCoverDraft(song.coverUrl||"");setEditingCover(true);}} style={BTN_GHOST}>Edit</button>}
          </div>
          {editingCover?(
            <>
              <p style={{ fontSize:12, color:"#8B7355", marginBottom:10, lineHeight:1.6 }}>Upload to <strong>Imgur</strong> and paste the direct image URL (ending in .jpg/.png).</p>
              <input value={coverDraft} onChange={e=>setCoverDraft(e.target.value)} placeholder="https://i.imgur.com/XXXXXXX.jpg" style={{...INPUT_S,marginBottom:8}} />
              {coverDraft&&<img src={coverDraft} alt="preview" style={{ maxHeight:80, maxWidth:"100%", objectFit:"contain", borderRadius:6, marginBottom:10, display:"block" }} onError={e=>e.target.style.opacity="0.2"} />}
              <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}><button onClick={()=>setEditingCover(false)} style={BTN_GHOST}>Cancel</button><button onClick={saveCover} style={BTN}>Save</button></div>
            </>
          ):(song.coverUrl?<img src={song.coverUrl} alt="cover" style={{ maxHeight:120, maxWidth:"100%", objectFit:"contain", borderRadius:8 }} onError={e=>e.target.style.opacity="0.2"} />:<div style={{ fontSize:13, color:"#C4A882", fontStyle:"italic" }}>{canEdit?"No cover image — click Edit to add one via Imgur.":"No cover image."}</div>)}
        </div>
        <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:12, padding:22, marginBottom:16 }}>
          <SectionLabel>Event Type</SectionLabel>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
            {EVENT_TYPES.map(tag=>{ const active=song.eventTags.includes(tag),c=TAG_COLORS[tag]||TAG_COLORS.Other; return <button key={tag} onClick={()=>toggleTag(tag)} style={{ fontSize:13, padding:"6px 14px", borderRadius:20, cursor:canEdit?"pointer":"default", fontFamily:F, fontWeight:500, border:active?`1.5px solid ${c.color}`:"0.5px solid #D4B896", background:active?c.bg:"transparent", color:active?c.color:"#8B7355" }}>{tag}</button>; })}
          </div>
        </div>
        <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:12, padding:22, marginBottom:16 }}>
          <SectionLabel>Performed Status</SectionLabel>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
            {PERFORMED_OPTS.map(opt=>{ const active=perfKey===opt,c=PERFORMED_COLORS[opt]; return <button key={opt} onClick={()=>{if(!canEdit)return;updateSong({performed:opt==="Performed"?(year?`Performed ${year}`:"Performed"):opt});}} style={{ fontSize:13, padding:"6px 14px", borderRadius:20, cursor:canEdit?"pointer":"default", fontFamily:F, fontWeight:500, border:active?`1.5px solid ${c.color}`:"0.5px solid #D4B896", background:active?c.bg:"transparent", color:active?c.color:"#8B7355" }}>{opt}</button>; })}
            {perfKey==="Performed"&&canEdit&&<input value={year} onChange={e=>updateSong({performed:e.target.value?`Performed ${e.target.value}`:"Performed"})} placeholder="Year (e.g. 2025)" style={{ border:"0.5px solid #D4B896", borderRadius:8, padding:"6px 12px", fontSize:13, fontFamily:F, outline:"none", width:145, background:"#FDFAF6" }} />}
            {perfKey==="Performed"&&!canEdit&&year&&<span style={{ fontSize:13, color:"#8B7355" }}>{year}</span>}
          </div>
        </div>
        <div style={{ background:"#FFF", border:"0.5px solid #E8DCCC", borderRadius:12, padding:22 }}>
          <SectionLabel>About This Song</SectionLabel>
          <textarea value={song.about||""} readOnly={!canEdit} onChange={e=>canEdit&&updateSong({about:e.target.value})} placeholder={canEdit?"Background, history, choreographer, costume details…":"No description yet."} style={{ width:"100%", border:"0.5px solid #E0D4C0", borderRadius:8, padding:"12px 14px", fontSize:14, fontFamily:F, resize:"vertical", minHeight:190, background:canEdit?"#FDFAF6":"#F8F4EE", color:"#2C1810", outline:"none", boxSizing:"border-box", lineHeight:1.75 }} />
        </div>
      </div>
    );
  }

  // ── Mount ─────────────────────────────────────────────────────────────────────
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>
</body>
</html>
